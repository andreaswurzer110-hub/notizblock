name: notizblock-aw # Im Snap Store registriert (notizblock war vergeben).
adopt-info: notizblock # Version wird im Part aus pubspec.yaml gesetzt.
# Store-Text (Stand 2026-10-06, passend zu docs/store-eintrag.md). Geht bei jedem
# `snapcraft upload` mit in den Store; Änderungen im Dashboard hier nachziehen.
title: Notizblock AW
summary: Bunte Notizen, Notizzettel auf dem Desktop und Sync mit Android und Windows
description: |
  Notizblock AW – deine Notizen, schlicht und schön.

  Schnell etwas aufschreiben, wiederfinden und auf jedem Gerät dabeihaben:
  Notizblock AW ist ein werbefreier Notizblock ohne Schnickschnack – für
  Gedanken, Bibelverse, Andachten, Einkaufslisten und alles, was du dir
  merken willst.

  Notizzettel direkt auf dem Desktop
  Jede Notiz lässt sich als eigener Notizzettel auf den Desktop heften. Die
  Zettel merken sich Größe und Position und starten auf Wunsch automatisch
  mit der Anmeldung.

  Das kann Notizblock AW:
  - Notizen in 25 Farben – anheften, archivieren und wiederherstellen
  - Ordner für Ordnung, z. B. Bibelverse, Andacht und Alltag
  - Einkaufslisten mit Mengen und Häkchen – Erledigtes wandert nach unten
  - Tabellen für Listen mit mehreren Spalten, z. B. Leseplan oder Geräteliste
  - Schnelle Suche in Titeln und Inhalten
  - Rückgängig und Wiederholen beim Schreiben
  - Frühere Versionen einer Notiz wiederherstellen
  - Drucken oder als PDF, Text- und Word-Datei speichern
  - Hell oder dunkel – folgt deinem System
  - 13 Sprachen, Deutsch als Standard

  Synchron auf allen Geräten
  Über dein eigenes Google Drive gleicht Notizblock AW deine Notizen zwischen
  Linux, Windows und Android ab. Es gibt keinen eigenen Server: Deine Notizen
  liegen nur auf deinen Geräten und – wenn du willst – in deinem Google
  Drive. Der Abgleich ist freiwillig, ohne Anmeldung funktioniert die App
  vollständig offline.

  Auch erhältlich für:
  - Android (Google Play): https://play.google.com/store/apps/details?id=at.aw.notizblock
  - Windows (Microsoft Store): https://apps.microsoft.com/detail/9N8MGP7GQV4L

  Kostenlos und ohne Werbung – keine Abos, kein Konto nötig.

  Datenschutz: https://andreaswurzer110-hub.github.io/notizblock-privacy/

  Entwickelt von Andreas Wurzer mit Claude Code. Code und Texte sind teilweise
  KI-generiert und vom Entwickler geprüft. Bibelverse in den Bildern:
  Schlachter-Übersetzung 1951.
website: https://andreaswurzer110-hub.github.io/notizblock-privacy/
contact: andi-w-apps@tuta.com

base: core22
confinement: strict
grade: stable
# lzo statt des Standards xz (seit 1.31.11): Beim ersten Start nach dem
# Hochfahren muss Linux Flutter-Engine, App-Code und pdfium aus dem Snap
# entpacken – xz ist dabei der Bremsklotz. Gemessen am 2026-10-05 in WSL
# (gleicher Inhalt, Seitencache geleert): Hauptfenster 0,25–0,35 s früher da
# (App-Teil 1,15–1,3 s statt 1,5 s) auf einem schnellen Desktop-Prozessor,
# auf einem Notebook-i5 entsprechend mehr. Kostet ~4 MB Download (18 statt 14 MB).
# Das gnome-42-2204-Laufzeitpaket ist von Canonical bereits mit lzo gepackt.
compression: lzo

apps:
  notizblock-aw: # App-Name = Snap-Name → Start per `notizblock-aw`.
    command: notizblock # Name der gebauten Flutter-Binärdatei (BINARY_NAME).
    extensions: [gnome] # GTK3/GNOME-Integration: Grafik, Wayland/X11, Themes, Portale.
    # Autostart: snapd startet die zur Laufzeit nach
    # $SNAP_USER_DATA/.config/autostart/notizblock-aw.desktop geschriebene Datei
    # (sandbox-sicher; AutostartService schreibt/löscht sie). Muss exakt diesem
    # Dateinamen entsprechen.
    autostart: notizblock-aw.desktop
    plugs:
      - network # Google-Drive-Sync
      - network-bind # lokaler Loopback-Server für den OAuth-Consent
      - x11 # XWayland: nötig, weil der Runner GDK_BACKEND=x11 erzwingt (Sticky-Positionen)

parts:
  notizblock:
    source: .
    # BEWUSST `plugin: nil` statt `plugin: flutter` (seit 1.31.8.0).
    # Das flutter-Plugin klont immer den KOPF eines Kanals
    # (`git clone --depth 1 -b stable`) und laesst sich nicht festnageln:
    # `flutter-channel` akzeptiert nur stable/master/beta, keine Version.
    # Die CI baut damit gegen ein anderes SDK als der Arbeitsplatz, und ein
    # neues Flutter-Release kann den Snap ohne eigene Aenderung zerlegen –
    # genau das passierte am 20.08.2026: Flutter 3.47.1 (19.08.) bringt ein
    # flutter_localizations, das `intl ^0.20.3` verlangt, waehrend pubspec
    # `intl 0.20.2` festhaelt -> "version solving failed".
    # Darum laden wir das offizielle SDK-Tarball in FLUTTER_VERSION und
    # fuehren die Schritte des Plugins selbst aus (identisch zu dessen
    # get_build_commands: precache, pub get, build linux, bundle kopieren).
    # Flathub macht es ueber `tag:` genauso (flatpak/flatpak-flutter.yml).
    #
    # BEI FLUTTER-UPDATE: FLUTTER_VERSION auf die lokal genutzte Version
    # ziehen (`flutter --version`), sonst weichen CI und Arbeitsplatz wieder
    # voneinander ab.
    plugin: nil
    build-packages:
      # Dieselben Pakete, die das flutter-Plugin mitbringen wuerde ...
      - clang
      - cmake
      - curl
      - git
      - ninja-build
      - unzip
      # ... plus xz-utils fuer das .tar.xz des SDK.
      - xz-utils
      # ... plus pkg-config als SICHERHEITSNETZ. Flutters
      # linux/flutter/CMakeLists.txt verlangt es (`find_package(PkgConfig
      # REQUIRED)`), das flutter-Plugin fuehrt es nicht auf. Normalerweise
      # liefert es das gnome-42-2204-sdk (steht im PATH vor /usr/bin; im
      # Build-Log per `command -v pkg-config` sichtbar). Beim Tag-Build fuer
      # 1.31.9.0 (16.09.2026) fand CMake es trotzdem nicht ("Could NOT find
      # PkgConfig") - bei identischer snapcraft-Revision (18514) und
      # identischem SDK (stable Rev. 381). Der Neustart 10 Minuten spaeter nahm
      # wieder das SDK-pkg-config: vermutlich ein Aussetzer beim Einhaengen des
      # SDK-Snaps, Ursache nicht restlos geklaert. Mit diesem Paket liegt dann
      # wenigstens /usr/bin/pkg-config bereit; die GTK-.pc-Dateien findet es
      # ueber PKG_CONFIG_PATH der gnome-Extension.
      - pkg-config
    build-environment:
      - FLUTTER_VERSION: '3.44.4'
    override-build: |
      set -eu

      # Dedizierten, bewusst öffentlichen Linux-OAuth-Client einspielen
      # (im Repo gitignored unter lib/services; Quelle in flatpak/).
      cp flatpak/google_drive_config.dart lib/services/google_drive_config.dart

      # Flutter-SDK in FESTER Version bereitstellen – je Version ein eigener
      # Ordner, fertig entpackt erst mit der Marke .komplett. Liegt im $HOME
      # der Bauumgebung statt im Part-Ordner: Beim lokalen Bau in WSL bleibt
      # der LXD-Container zwischen den Bauten erhalten, das SDK (~1,1 GB) wird
      # dann nur beim ersten Bau bzw. nach einem Versionswechsel geladen.
      # (In GitHub Actions ist die Umgebung ohnehin jedes Mal frisch.)
      SDK_CACHE="${HOME:-/root}/.cache/flutter-sdk"
      FLUTTER_DIR="$SDK_CACHE/$FLUTTER_VERSION"
      if [ ! -f "$FLUTTER_DIR/.komplett" ]; then
        rm -rf "$FLUTTER_DIR" "$SDK_CACHE/flutter"
        mkdir -p "$SDK_CACHE"
        curl -fsSL -o "$SDK_CACHE/flutter.tar.xz" \
          "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
        tar -xJf "$SDK_CACHE/flutter.tar.xz" -C "$SDK_CACHE"
        mv "$SDK_CACHE/flutter" "$FLUTTER_DIR"
        rm -f "$SDK_CACHE/flutter.tar.xz"
        touch "$FLUTTER_DIR/.komplett"
      fi
      export PATH="$FLUTTER_DIR/bin:$PATH"
      # Snapcraft baut als root, dem das entpackte SDK sonst "dubious
      # ownership" meldet und Flutter die Versionserkennung verweigert.
      git config --global --add safe.directory "$FLUTTER_DIR"
      # Steht so im Build-Log: hier laesst sich nachlesen, womit gebaut wurde.
      flutter --version
      # Ebenso: welches pkg-config und welche GTK-Version der Build sieht
      # (Diagnose fuer den pkg-config-Ausfall vom 16.09.2026, siehe oben).
      command -v pkg-config || echo "pkg-config NICHT im PATH"
      pkg-config --modversion gtk+-3.0 || echo "gtk+-3.0 per pkg-config NICHT gefunden"

      flutter precache --linux
      flutter pub get
      flutter build linux --release --target lib/main.dart
      cp -r build/linux/*/release/bundle/* "$CRAFT_PART_INSTALL/"

      # Snap-Version = die 4-teilige msix_version aus pubspec (z.B. 1.25.5.3),
      # damit der Store die volle Nummer inkl. Revision zeigt. pubspec `version:`
      # ist nur 3-teilig (semver), taugt dafür nicht.
      craftctl set version="$(sed -n 's/^[[:space:]]*msix_version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)"
