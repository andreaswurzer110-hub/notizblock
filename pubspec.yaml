name: notizblock
description: Eine schlichte Notizblock-App mit Widgets und Google Drive Sync
publish_to: 'none'
version: 1.19.0+19

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0 # For desktop platforms
  sqlite3_flutter_libs: ^0.5.0 # Bündelt native sqlite3.dll/.so für Windows/Linux
  path: ^1.8.3
  path_provider: ^2.1.1
  
  # Google Drive
  googleapis: ^12.0.0
  googleapis_auth: ^1.4.1
  google_sign_in: ^6.1.6
  http: ^1.1.0
  url_launcher: ^6.2.0 # Browser für Desktop-OAuth-Consent öffnen
  
  # Home Screen Widgets (Android)
  home_widget: ^0.7.0

  # Desktop-Fensterverwaltung (Position/Größe der Sticky-Note-Fenster)
  window_manager: ^0.4.0
  
  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  
  # Utilities
  uuid: ^4.2.1
  intl: 0.20.2
  shared_preferences: ^2.2.2
  workmanager: ^0.9.0+3
  package_info_plus: ^8.0.0 # App-Version dynamisch (überall identisch zur pubspec/Build-Version)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_full.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/icon_full.png"
    icon_size: 256

flutter:
  uses-material-design: true
  generate: true