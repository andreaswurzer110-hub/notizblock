name: notizblock
description: "Notizblock AW – schlichte, plattformübergreifende Notiz-App (Android, Windows, Linux) mit Google-Drive-Sync."
publish_to: 'none'
# Versionsname (vor dem +, nur 3-teilig möglich = semver) + Build-Nummer
# (nach dem +) = Android-versionCode; MUSS bei jedem Play-Upload streng steigen.
# Schema: versionCode = die 4-teilige Anzeigeversion OHNE Punkte (1.25.6.0 →
# 12560, 1.25.7.0 → 12570). Die 4. Stelle ist normalerweise 0 (gleiche Version
# auf allen Kanälen, s. kAppVersionDisplay). Ausnahme: ein NUR-mobiler Hotfix
# nutzt die 4. Stelle (1.25.6.1 → 12561) und wird per --build-name am AAB-Build
# gesetzt, da pubspec keine 4. Stelle führen kann.
version: 1.30.0+13000

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0 # For desktop platforms
  sqlite3_flutter_libs: ^0.5.0 # Bündelt native sqlite3.dll/.so für Windows/Linux
  path: ^1.8.3
  path_provider: ^2.1.1
  
  # Google Drive
  googleapis: ^12.0.0
  googleapis_auth: ^1.4.1
  google_sign_in: ^6.1.6
  http: ^1.1.0
  url_launcher: ^6.2.0 # Browser für Desktop-OAuth-Consent öffnen
  
  # Home Screen Widgets (Android)
  home_widget: ^0.7.0

  # Desktop-Fensterverwaltung (Position/Größe der Sticky-Note-Fenster)
  window_manager: ^0.4.0

  # D-Bus (Linux): XDG-Background-Portal für Flatpak-Autostart (reines Dart,
  # auf Windows/Android ungenutzt). Siehe AutostartService.
  dbus: ^0.7.10
  
  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  
  # Utilities
  uuid: ^4.2.1
  intl: 0.20.2
  shared_preferences: ^2.2.2
  workmanager: ^0.9.0+3
  ffi: ^2.1.0 # Win32-API RegisterApplicationRestart (Neustart nach App-Update)
  package_info_plus: ^8.0.0 # App-Version dynamisch (überall identisch zur pubspec/Build-Version)

  # Drucken & Exportieren einer Notiz (Kontextmenü „Drucken")
  pdf: ^3.12.0 # PDF-Dokument erzeugen (auch Grundlage fürs Drucken)
  printing: ^5.14.3 # System-Druckdialog (Android/Windows/Linux)
  archive: ^4.0.9 # .docx = ZIP mit XML -> selbst gebaut, kein Word nötig
  file_picker: ^11.0.3 # „Speichern unter"-Dialog (Desktop) bzw. SAF (Android)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.0
  msix: ^3.16.13

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_full.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/icon_full.png"
    icon_size: 256

flutter:
  uses-material-design: true
  generate: true
  assets:
    # App-Icon als .ico – wird zur Laufzeit für die Windows-Autostart-
    # Verknüpfung herausgeschrieben (IconLocation), damit der Eintrag das
    # richtige Icon zeigt statt des Explorer-Icons.
    - assets/icon/app_icon.ico

# Microsoft-Store-/Sideload-Paket (Windows). Bauen: dart run msix:create
# TEST-Konfiguration: selbstsigniertes Zertifikat aus certs\ – `publisher` MUSS
# exakt dem Zertifikat-Subject (CN=Andreas Wurzer) entsprechen, sonst weigert
# sich Windows zu installieren.
# Für die echte Store-Veröffentlichung: den certificate_*-Block entfernen, mit
# `dart run msix:create --store` bauen (der Store signiert selbst) und Identität
# auf die Partner-Center-Werte setzen:
#   identity_name:          AndreasWurzer.NotizblockAW
#   publisher:              CN=8931876D-7B1F-44B7-8CE7-B81EAAF9533B
#   publisher_display_name: Andreas Wurzer
#   (Store-ID 9N8MGP7GQV4L, PFN AndreasWurzer.NotizblockAW_cpc57phzf9bfg)
msix_config:
  display_name: Notizblock AW
  publisher_display_name: Andreas Wurzer
  identity_name: AW.NotizblockAW
  publisher: CN=Andreas Wurzer
  # Eine HÖHERE Version als die installierte ermöglicht das In-Place-Update
  # (Add-AppxPackage ohne vorheriges Remove) → Taskleisten-/Startmenü-Pin bleibt.
  # Bei jedem Release Minor/Patch hochzählen; bei schnellen lokalen Re-Builds
  # derselben Release-Version die 4. Stelle (Revision) erhöhen.
  msix_version: 1.30.0.0
  logo_path: assets/icon/icon_full.png
  capabilities: internetClient
  architecture: x64
  certificate_path: certs/notizblock_test.pfx
  certificate_password: notizblock
  install_certificate: false
  output_path: build/msix
  output_name: Notizblock-1.30.0.0
  # Bewusst KEINE startup_task hier: der Autostart läuft über eine Startup-Ordner-
  # Verknüpfung (AutostartService, AppsFolder-Aktivierung), weil paketbasierte
  # StartupTasks auf manchen Systemen nicht im Task-Manager/in den Einstellungen
  # auftauchen und sich dort nicht umschalten lassen.