id: io.github.andreaswurzer110_hub.Notizblock
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: notizblock

finish-args:
  - --share=network
  - --socket=x11
  - --share=ipc
  - --device=dri

cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/pkgconfig

modules:
  - name: notizblock
    buildsystem: simple
    build-options:
      append-path: /run/build/notizblock/wrappers:/run/build/notizblock/flutter/bin
      env:
        NOTIZBLOCK_APP_ID: io.github.andreaswurzer110_hub.Notizblock
        PUB_CACHE: /run/build/notizblock/.pub-cache
    build-commands:
      - mkdir -p wrappers && printf '#!/bin/sh\nexec g++ "$@"\n' > wrappers/clang++ && chmod +x wrappers/clang++
      - printf '#!/bin/sh\nexec gcc "$@"\n' > wrappers/clang && chmod +x wrappers/clang
      - cp flatpak/google_drive_config.dart lib/services/google_drive_config.dart
      - flutter config --no-analytics --no-cli-animations
      - flutter pub get --offline
      - flutter build linux --release --verbose
      - mkdir -p /app/notizblock
      - cp -r build/linux/*/release/bundle/. /app/notizblock/
      - mkdir -p /app/bin
      - ln -s /app/notizblock/notizblock /app/bin/notizblock
      - install -Dm644 flatpak/io.github.andreaswurzer110_hub.Notizblock.desktop
        /app/share/applications/io.github.andreaswurzer110_hub.Notizblock.desktop
      - install -Dm644 flatpak/icons/icon-256.png
        /app/share/icons/hicolor/256x256/apps/io.github.andreaswurzer110_hub.Notizblock.png
      - install -Dm644 flatpak/io.github.andreaswurzer110_hub.Notizblock.metainfo.xml
        /app/share/metainfo/io.github.andreaswurzer110_hub.Notizblock.metainfo.xml
    sources:
      # Lokaler Test: file://-Source. Für Flathub durch echte Git-URL + tag ersetzen.
      - type: git
        url: file:///home/andi/notizblock
        tag: v1.25.0
      # Flutter SDK: wird von flatpak-flutter durch generates/modules/flutter-sdk-3.44.0.json ersetzt.
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: '3.44.0'
        dest: flutter
