# Snap bauen & in den Snap Store veröffentlichen (GitHub Actions = Cloud-Linux).
#
# So lässt sich der Snap komplett von Windows aus releasen:
#   - Tag vX.Y.Z pushen → baut + veröffentlicht nach EDGE (Testkanal).
#   - "Run workflow" (manuell) → baut + veröffentlicht in den gewählten Channel;
#     STABLE gibt es nur auf diesem Weg, also nur bewusst und von Hand.
#
#   GEÄNDERT 2026-08-23 (Andi): Ein Tag ging vorher direkt nach STABLE, hat also
#   bei jedem Release ungeprüft an ALLE Linux-Nutzer ausgeliefert. Jetzt landet
#   ein Tag im selben Testkanal wie das Android-Release im internen Test –
#   erst prüfen, dann bewusst nach stable schieben.
#
#   Einen bereits gebauten Stand nach stable bringen: NICHT neu bauen, sondern
#   die Revision umhängen (promote_revision, siehe unten beim promote-Job).
#
# VORAUSSETZUNG (einmalig, braucht einmal Linux/Zorin – siehe snap/README.md):
#   Repo-Secret SNAPCRAFT_STORE_CREDENTIALS setzen (aus `snapcraft export-login`).
#   Ohne das Secret läuft nur der BUILD (gut zum Validieren), das Veröffentlichen
#   wird übersprungen.

name: Snap-Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Channel (edge/beta/candidate/stable)'
        required: false
        default: edge
      promote_revision:
        description: 'Nur eine BESTEHENDE Revision in diesen Channel schieben (z.B. 45) - dann wird NICHT neu gebaut'
        required: false
        default: ''

concurrency:
  group: snap-build
  cancel-in-progress: true

# Node-20-Deprecation (ab 16.06.2026 erzwingt GitHub Node 24): checkout/
# upload-artifact laufen unten bereits auf node24-nativen Majors. Die
# snapcore-Actions gibt es nur als @v1 (node20, kein node24-Release) → dieses
# offizielle Opt-in-Flag zwingt sie schon JETZT auf Node 24, sodass wir vor
# der Frist sehen, dass die Pipeline auf Node 24 weiter funktioniert. Sobald
# snapcore eine node24-Version hat: Version bumpen + dieses Flag entfernen.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Normalfall: bauen und die frische Revision veröffentlichen.
  # Wird übersprungen, wenn nur eine bestehende Revision umgehängt werden soll.
  build-and-publish:
    if: github.event.inputs.promote_revision == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Snap bauen
        id: build
        uses: snapcore/action-build@v1

      # Gebaute .snap auch als Artefakt anhängen (zum lokalen Testen herunterladbar,
      # auch ohne Store-Credentials).
      - name: Snap als Artefakt
        uses: actions/upload-artifact@v7
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}

      - name: Store-Credentials vorhanden?
        id: creds
        env:
          C: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -n "$C" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: In den Snap Store veröffentlichen
        if: steps.creds.outputs.has == 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          # Manuell gewählter Channel, sonst edge. Ein Tag landet damit in EDGE –
          # stable erreicht man nur über "Run workflow" (bewusst, siehe Kopf).
          release: ${{ github.event.inputs.release || 'edge' }}

  # Bestehende Revision in einen weiteren Channel schieben, OHNE neu zu bauen.
  # WARUM: Ein zweiter Build derselben Quelle erzeugt eine zweite Revision mit
  # identischem Inhalt – die Channels zeigen dann auf verschiedene Revisionen
  # desselben Stands. Umhängen hält beide auf genau denselben Bits.
  #   gh workflow run snap.yml --ref main -f promote_revision=45 -f release=edge
  # Revisionsnummern: `snapcraft status notizblock-aw` bzw. das Log des
  # Veröffentlichen-Schritts ("Revision N created ... released to ...").
  promote:
    if: github.event.inputs.promote_revision != ''
    runs-on: ubuntu-latest
    steps:
      - name: Store-Credentials vorhanden?
        id: creds
        env:
          C: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -n "$C" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "SNAPCRAFT_STORE_CREDENTIALS fehlt -> Umhängen wird übersprungen."; echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: snapcraft bereitstellen
        if: steps.creds.outputs.has == 'true'
        run: sudo snap install snapcraft --classic

      - name: Revision in den Channel schieben
        if: steps.creds.outputs.has == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          REV: ${{ github.event.inputs.promote_revision }}
          CH: ${{ github.event.inputs.release }}
        run: |
          case "$REV" in ''|*[!0-9]*) echo "promote_revision muss eine Zahl sein, war: '$REV'" >&2; exit 1;; esac
          snapcraft release notizblock-aw "$REV" "$CH"
          snapcraft status notizblock-aw
