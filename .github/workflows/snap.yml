# Snap bauen & in den Snap Store veröffentlichen (GitHub Actions = Cloud-Linux).
#
# So lässt sich der Snap komplett von Windows aus releasen:
#   - "Run workflow" (manuell) → baut + veröffentlicht in den gewählten Channel
#     (Default edge) → zum Testen.
#   - Tag vX.Y.Z pushen → baut + veröffentlicht in stable (das Release).
#
# VORAUSSETZUNG (einmalig, braucht einmal Linux/Zorin – siehe snap/README.md):
#   Repo-Secret SNAPCRAFT_STORE_CREDENTIALS setzen (aus `snapcraft export-login`).
#   Ohne das Secret läuft nur der BUILD (gut zum Validieren), das Veröffentlichen
#   wird übersprungen.

name: Snap-Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Channel (edge/beta/candidate/stable)'
        required: false
        default: edge

concurrency:
  group: snap-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snap bauen
        id: build
        uses: snapcore/action-build@v1

      # Gebaute .snap auch als Artefakt anhängen (zum lokalen Testen herunterladbar,
      # auch ohne Store-Credentials).
      - name: Snap als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}

      - name: Store-Credentials vorhanden?
        id: creds
        env:
          C: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -n "$C" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: In den Snap Store veröffentlichen
        if: steps.creds.outputs.has == 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          # Tag → stable, sonst der manuell gewählte Channel (Default edge).
          release: ${{ github.event.inputs.release || (startsWith(github.ref, 'refs/tags/v') && 'stable' || 'edge') }}
