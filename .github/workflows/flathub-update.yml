# Automatischer Flathub-Update-Push.
#
# Idee: Der Linux-only-Teil (Offline-Sources regenerieren + Flatpak test-bauen)
# läuft auf einem Ubuntu-Runner (= echtes Linux in der Cloud). Dadurch lässt sich
# ein Release komplett von Windows aus auslösen: Version bumpen, Tag pushen –
# der Rest passiert hier, und Flathubs Buildbot veröffentlicht danach selbst.
#
# Ablauf je Release:
#   1) Tag vX.Y.Z im App-Repo wird gepusht  → triggert diesen Workflow.
#   2) flatpak-flutter regeneriert generated/ (Flutter-SDK + pub-Sources).
#   3) flatpak-builder baut testweise (verifiziert, dass es überhaupt baut).
#   4) Manifest + generated/ werden ins Flathub-Repo gepusht → Buildbot baut/published.
#
# VORAUSSETZUNGEN (einmalig, siehe flatpak/RELEASING.md):
#   - Flathub-Repo existiert (nach Merge von PR #8949 gegen den new-pr-Branch).
#   - Repo-Secret FLATHUB_TOKEN (PAT mit Schreibrecht auf das Flathub-Repo).
#
# Drei Stellen, die beim ERSTEN Lauf zu verifizieren sind (Kommentare unten):
#   [V1] Container-Image-Tag (gnome-49 muss als Image existieren)
#   [V2] exakte flatpak-flutter-CLI (an das anpassen, was auf Zorin lief)
#   [V3] Default-Branch des Flathub-Repos (meist master)

name: Flathub-Update

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag (z.B. v1.26.0). Leer = der auslösende/aktuelle Tag.'
        required: false

concurrency:
  group: flathub-update
  cancel-in-progress: false

env:
  APP_ID: io.github.andreaswurzer110_hub.Notizblock
  APP_GIT_URL: https://github.com/andreaswurzer110-hub/notizblock.git
  FLATHUB_REPO: flathub/io.github.andreaswurzer110_hub.Notizblock
  FLATHUB_BRANCH: master            # [V3]
  FF_REF: v0.15.0                    # flatpak-flutter-Version (wie auf Zorin)

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      # [V1] Fedora-basiertes Flatpak-Builder-Image mit GNOME-49-Runtime/SDK.
      # Falls dieser Tag (noch) nicht existiert: aktuell verfügbaren gnome-XX-Tag
      # nehmen und unten runtime-version im Manifest entsprechend halten.
      image: bilelmoussaoui/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - name: Release-Tag bestimmen
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release-Tag: $TAG"

      - name: App-Repo am Tag auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Werkzeuge (python, git, yq)
        run: |
          dnf install -y python3 python3-pip git >/dev/null
          curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/bin/yq
          chmod +x /usr/bin/yq

      - name: flatpak-flutter holen (gepinnt)
        run: |
          git clone --depth 1 --branch "${FF_REF}" https://github.com/TheAppgineer/flatpak-flutter.git /opt/flatpak-flutter
          # Python-Abhängigkeiten des Tools installieren, falls vorhanden.
          [ -f /opt/flatpak-flutter/requirements.txt ] && pip3 install -r /opt/flatpak-flutter/requirements.txt || true

      - name: Quell-Manifest auf GitHub-URL + Release-Tag setzen
        working-directory: flatpak
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          URL: ${{ env.APP_GIT_URL }}
        run: |
          # Die Vorlage zeigt lokal auf file:///home/andi/notizblock – für CI/Flathub
          # auf die echte Git-URL + den Release-Tag umbiegen (modules[0]=notizblock,
          # sources[0]=App-Git-Source). flatpak-flutter pinnt den commit selbst neu.
          yq -i '.modules[0].sources[0].url = strenv(URL)' flatpak-flutter.yml
          yq -i '.modules[0].sources[0].tag = strenv(TAG)' flatpak-flutter.yml
          yq -i 'del(.modules[0].sources[0].commit)' flatpak-flutter.yml

      - name: Offline-Sources regenerieren (flatpak-flutter)
        working-directory: flatpak
        run: |
          # [V2] Exakt die CLI verwenden, die auf Zorin lief
          #      (dort: history | grep flatpak-flutter). Best guess:
          python3 /opt/flatpak-flutter/flatpak-flutter.py flatpak-flutter.yml

      - name: Test-Build (verifiziert Baubarkeit)
        working-directory: flatpak
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --install-deps-from=flathub build-dir "${APP_ID}.yml"

      - name: Manifest + generated/ ins Flathub-Repo pushen
        env:
          FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$FLATHUB_TOKEN" ]; then
            echo "::error::Secret FLATHUB_TOKEN fehlt – siehe flatpak/RELEASING.md"; exit 1
          fi
          git clone --depth 1 --branch "${FLATHUB_BRANCH}" \
            "https://x-access-token:${FLATHUB_TOKEN}@github.com/${FLATHUB_REPO}.git" /tmp/flathub
          # Nur Manifest + generated/ ersetzen – Rest (metainfo/desktop/icon/config)
          # zieht der Build aus der Git-Source des App-Repos.
          rm -rf /tmp/flathub/generated
          cp -r flatpak/generated /tmp/flathub/generated
          cp "flatpak/${APP_ID}.yml" "/tmp/flathub/${APP_ID}.yml"
          cd /tmp/flathub
          git config user.name  "notizblock-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen am Flathub-Manifest – nichts zu pushen."; exit 0
          fi
          git commit -m "Notizblock ${TAG}"
          git push origin "${FLATHUB_BRANCH}"
          echo "Gepusht → Flathub-Buildbot baut & veröffentlicht."
